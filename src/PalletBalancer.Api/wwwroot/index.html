<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PalletBalancer — Acceso</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      background: #0a0f1e;
      background-image:
        radial-gradient(ellipse 80% 60% at 50% -10%, rgba(212,0,26,0.14) 0%, transparent 65%),
        radial-gradient(ellipse 40% 40% at 90% 80%, rgba(0,102,51,0.08) 0%, transparent 60%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }

    .login-card {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.09);
      border-radius: 20px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 30px 60px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.04);
      padding: 2.5rem 2.25rem;
      width: 100%;
      max-width: 380px;
    }

    .logo-wrap {
      text-align: center;
      margin-bottom: 1.5rem;
    }
    .logo-wrap img {
      height: 70px;
      /* bright logo on dark: make white bg transparent-ish using mix-blend-mode */
      border-radius: 10px;
      background: #fff;
      padding: 8px 14px;
    }

    .app-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: #fff;
      text-align: center;
      margin: 0;
      letter-spacing: -0.2px;
    }

    .app-sub {
      text-align: center;
      color: rgba(255,255,255,0.35);
      font-size: 0.75rem;
      margin-bottom: 2rem;
      margin-top: 0.15rem;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .form-label {
      color: rgba(255,255,255,0.55);
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.9px;
      margin-bottom: 0.4rem;
    }

    .form-control {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px;
      color: #fff;
      padding: 0.65rem 0.85rem;
      font-size: 0.95rem;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .form-control:focus {
      background: rgba(255,255,255,0.09);
      border-color: rgba(212,0,26,0.6);
      box-shadow: 0 0 0 3px rgba(212,0,26,0.12);
      color: #fff;
      outline: none;
    }
    .form-control::placeholder { color: rgba(255,255,255,0.18); }

    .btn-login {
      background: linear-gradient(135deg, #d4001a 0%, #8f0012 100%);
      border: none;
      border-radius: 10px;
      color: #fff;
      font-weight: 700;
      font-size: 0.95rem;
      padding: 0.72rem;
      width: 100%;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.15s;
      box-shadow: 0 4px 18px rgba(212,0,26,0.3);
      letter-spacing: 0.3px;
    }
    .btn-login:hover:not(:disabled) { opacity: 0.88; transform: translateY(-1px); }
    .btn-login:disabled { opacity: 0.5; cursor: not-allowed; }

    .alert-danger {
      background: rgba(212,0,26,0.12);
      border: 1px solid rgba(212,0,26,0.28);
      border-radius: 10px;
      color: #ff7070;
      font-size: 0.88rem;
      padding: 0.65rem 0.9rem;
      margin-bottom: 1.25rem;
    }
  </style>
</head>
<body x-data="loginApp()" x-init="init()">

<div class="login-card">
  <div class="logo-wrap">
    <img src="assets/logo-melco.jpg" alt="MELCO Logistics">
  </div>
  <h1 class="app-title">PalletBalancer</h1>
  <p class="app-sub">Sistema de estiba</p>

  <div x-show="error" class="alert-danger" x-text="error"></div>

  <form @submit.prevent="login()">
    <div class="mb-3">
      <label class="form-label">Usuario</label>
      <input type="text" class="form-control" x-model="username" required autofocus placeholder="nombre de usuario">
    </div>
    <div class="mb-4">
      <label class="form-label">Contraseña</label>
      <input type="password" class="form-control" x-model="password" required placeholder="••••••••">
    </div>
    <button type="submit" class="btn-login" :disabled="cargando">
      <span x-show="cargando" class="spinner-border spinner-border-sm me-2"></span>
      <span x-text="cargando ? 'Verificando...' : 'Ingresar'"></span>
    </button>
  </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js" defer></script>
<script>
function loginApp() {
  return {
    username: '',
    password: '',
    error:    '',
    cargando: false,

    init() {
      if (localStorage.getItem('pb_token')) {
        window.location.href = 'app.html';
      }
    },

    async login() {
      this.cargando = true;
      this.error    = '';
      try {
        const r = await fetch('/api/auth/login', {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify({ username: this.username, password: this.password })
        });
        if (!r.ok) {
          this.error = 'Usuario o contraseña incorrectos.';
          return;
        }
        const data = await r.json();
        localStorage.setItem('pb_token',   data.token);
        localStorage.setItem('pb_usuario', JSON.stringify({ username: data.username, rol: data.rol }));
        window.location.href = 'app.html';
      } catch {
        this.error = 'Error de conexión con el servidor.';
      } finally {
        this.cargando = false;
      }
    }
  };
}
</script>
</body>
</html>
